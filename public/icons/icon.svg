<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181630" />
      <stop offset="50%" stop-color="#0f0e21" />
      <stop offset="100%" stop-color="#090814" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242247" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#14132b" stop-opacity="0.95" />
    </linearGradient>

    <!-- Rhythm Pulse Gradient -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6558f5" />
      <stop offset="45%" stop-color="#8479ff" />
      <stop offset="70%" stop-color="#46a978" />
      <stop offset="100%" stop-color="#5be2a3" />
    </linearGradient>

    <!-- Glow Filter for Pulse -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Rim Light Border -->
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Ambient Light Reflection Behind Calendar Card -->
  <circle cx="256" cy="270" r="140" fill="#6558f5" opacity="0.18" filter="url(#softGlow)" />
  <circle cx="330" cy="240" r="100" fill="#46a978" opacity="0.14" filter="url(#softGlow)" />

  <!-- Calendar Base Container (Minimalist Glassmorphic Sheet) -->
  <rect x="88" y="104" width="336" height="312" rx="36" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.14)" stroke-width="3" />

  <!-- Calendar Top Header Banner Accent -->
  <path d="M 88 140 C 88 120 104 104 124 104 L 388 104 C 408 104 424 120 424 140 L 424 176 L 88 176 Z" fill="#6558f5" fill-opacity="0.22" />
  <line x1="88" y1="176" x2="424" y2="176" stroke="rgba(255,255,255,0.1)" stroke-width="2" />

  <!-- Calendar Binder Rings / Accent Pills -->
  <rect x="156" y="86" width="20" height="36" rx="10" fill="#6558f5" />
  <rect x="336" y="86" width="20" height="36" rx="10" fill="#46a978" />

  <!-- Calendar Top Status Dots -->
  <circle cx="216" cy="140" r="6" fill="#ff5d63" opacity="0.85" />
  <circle cx="256" cy="140" r="6" fill="#f2a641" opacity="0.85" />
  <circle cx="296" cy="140" r="6" fill="#46a978" opacity="0.85" />

  <!-- Calendar Grid Subtle Matrix (Background dots) -->
  <circle cx="152" cy="226" r="4" fill="rgba(255,255,255,0.18)" />
  <circle cx="216" cy="226" r="4" fill="rgba(255,255,255,0.18)" />
  <circle cx="296" cy="226" r="4" fill="rgba(255,255,255,0.18)" />
  <circle cx="360" cy="226" r="4" fill="rgba(255,255,255,0.18)" />

  <circle cx="152" cy="344" r="4" fill="rgba(255,255,255,0.18)" />
  <circle cx="216" cy="344" r="4" fill="rgba(255,255,255,0.18)" />
  <circle cx="296" cy="344" r="4" fill="rgba(255,255,255,0.18)" />
  <circle cx="360" cy="344" r="4" fill="rgba(255,255,255,0.18)" />

  <!-- Glow Underneath Rhythm Pulse Waveform -->
  <path
    d="M 108 286 L 180 286 L 206 250 L 230 334 L 264 196 L 298 344 L 324 286 L 404 286"
    fill="none"
    stroke="url(#pulseGrad)"
    stroke-width="18"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.35"
    filter="url(#glow)"
  />

  <!-- Main Crisp Rhythm Pulse Line -->
  <path
    d="M 108 286 L 180 286 L 206 250 L 230 334 L 264 196 L 298 344 L 324 286 L 404 286"
    fill="none"
    stroke="url(#pulseGrad)"
    stroke-width="9"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Rhythm Apex Anchor Pulse (Highlight at Primary Peak) -->
  <circle cx="264" cy="196" r="9" fill="#ffffff" filter="url(#glow)" />
  <circle cx="264" cy="196" r="5" fill="#46a978" />

  <!-- Rhythm Secondary Pulse (Highlight at Right Recovery) -->
  <circle cx="324" cy="286" r="5" fill="#5be2a3" />
</svg>
