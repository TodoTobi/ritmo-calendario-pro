<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Soft Diffused Drop Shadow Filter -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#181238" flood-opacity="0.16" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6558f5" flood-opacity="0.10" />
    </filter>

    <!-- Deep Ink Calendar Body Gradient -->
    <linearGradient id="cardBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181636" />
      <stop offset="100%" stop-color="#0e0c20" />
    </linearGradient>

    <!-- Rhythm Pulse Gradient (Ritmo Palette: Purple -> Blue -> Green) -->
    <linearGradient id="pulseLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6558f5" />
      <stop offset="38%" stop-color="#4c9af5" />
      <stop offset="72%" stop-color="#46a978" />
      <stop offset="100%" stop-color="#5be2a3" />
    </linearGradient>

    <!-- Pulse Line Glow Filter -->
    <filter id="pulseGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Pure White Full-Bleed Canvas (No clipped borders, perfectly mask-safe) -->
  <rect width="512" height="512" fill="#ffffff" />

  <!-- 2. Elevated Calendar Card Centered Perfectly (Symmetrical ~100px margins) -->
  <rect x="98" y="126" width="316" height="276" rx="36" fill="url(#cardBodyGrad)" filter="url(#cardShadow)" />
  <rect x="98" y="126" width="316" height="276" rx="36" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" />

  <!-- 3. Calendar Top Header Banner Strip -->
  <path d="M 98 160 C 98 141 113 126 132 126 L 380 126 C 399 126 414 141 414 160 L 414 194 L 98 194 Z" fill="#6558f5" fill-opacity="0.25" />
  <line x1="98" y1="194" x2="414" y2="194" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" />

  <!-- 4. Top Binder Rings (Ritmo Purple & Mint Green) -->
  <rect x="162" y="108" width="22" height="38" rx="11" fill="#6558f5" filter="drop-shadow(0px 3px 6px rgba(101,88,245,0.4))" />
  <rect x="328" y="108" width="22" height="38" rx="11" fill="#46a978" filter="drop-shadow(0px 3px 6px rgba(70,169,120,0.4))" />

  <!-- 5. Signature Semantic Dots (Red, Orange, Yellow, Green, Blue) -->
  <circle cx="200" cy="160" r="6" fill="#ff5d63" />
  <circle cx="228" cy="160" r="6" fill="#f2a641" />
  <circle cx="256" cy="160" r="6" fill="#e7c94a" />
  <circle cx="284" cy="160" r="6" fill="#46a978" />
  <circle cx="312" cy="160" r="6" fill="#4c9af5" />

  <!-- 6. Subtle Activity Blocks in Background -->
  <g opacity="0.18">
    <rect x="126" y="212" width="70" height="14" rx="7" fill="#ff5d63" />
    <rect x="206" y="212" width="96" height="14" rx="7" fill="#6558f5" />
    <rect x="312" y="212" width="74" height="14" rx="7" fill="#46a978" />
  </g>

  <!-- 7. Dynamic Rhythm Pulse Wave Overlay -->
  <path
    d="M 116 302 L 184 302 L 208 268 L 230 350 L 264 218 L 296 362 L 320 302 L 396 302"
    fill="none"
    stroke="#6558f5"
    stroke-width="20"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.25"
  />

  <path
    d="M 116 302 L 184 302 L 208 268 L 230 350 L 264 218 L 296 362 L 320 302 L 396 302"
    fill="none"
    stroke="url(#pulseLineGrad)"
    stroke-width="9.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#pulseGlow)"
  />

  <!-- 8. Luminous Apex Marker on Peak -->
  <circle cx="264" cy="218" r="9" fill="#ffffff" filter="drop-shadow(0px 0px 8px #5be2a3)" />
  <circle cx="264" cy="218" r="4.5" fill="#46a978" />
</svg>
