<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Card Drop Shadow Filter -->
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#141126" flood-opacity="0.14" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#6558f5" flood-opacity="0.10" />
    </filter>

    <!-- Calendar Card Gradient (Crisp Dark/Indigo Container to make the colors pop against the white canvas) -->
    <linearGradient id="cardBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1836" />
      <stop offset="100%" stop-color="#0f0d22" />
    </linearGradient>

    <!-- Rhythm Pulse Gradient (Ritmo Palette: Purple -> Blue -> Green) -->
    <linearGradient id="pulseLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6558f5" />
      <stop offset="35%" stop-color="#4c9af5" />
      <stop offset="70%" stop-color="#46a978" />
      <stop offset="100%" stop-color="#5be2a3" />
    </linearGradient>

    <!-- Pulse Line Glow Filter -->
    <filter id="pulseGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. White Canvas Base Squircle -->
  <rect width="512" height="512" rx="112" fill="#ffffff" />
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#e8e9f2" stroke-width="2" />

  <!-- 2. Elevated Calendar Card with Deep Shadow -->
  <rect x="84" y="100" width="344" height="320" rx="38" fill="url(#cardBodyGrad)" filter="url(#cardShadow)" />
  <rect x="84" y="100" width="344" height="320" rx="38" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" />

  <!-- 3. Calendar Top Header Banner Accent -->
  <path d="M 84 138 C 84 117 101 100 122 100 L 390 100 C 411 100 428 117 428 138 L 428 172 L 84 172 Z" fill="#6558f5" fill-opacity="0.25" />
  <line x1="84" y1="172" x2="428" y2="172" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" />

  <!-- 4. Top Binder Rings (Ritmo Purple and Mint Green) -->
  <rect x="154" y="82" width="22" height="38" rx="11" fill="#6558f5" filter="drop-shadow(0px 3px 6px rgba(101,88,245,0.4))" />
  <rect x="336" y="82" width="22" height="38" rx="11" fill="#46a978" filter="drop-shadow(0px 3px 6px rgba(70,169,120,0.4))" />

  <!-- 5. Signature Semantic Dots (Ritmo Palette: Red, Orange, Yellow, Green, Blue) -->
  <circle cx="196" cy="136" r="6.5" fill="#ff5d63" />
  <circle cx="226" cy="136" r="6.5" fill="#f2a641" />
  <circle cx="256" cy="136" r="6.5" fill="#e7c94a" />
  <circle cx="286" cy="136" r="6.5" fill="#46a978" />
  <circle cx="316" cy="136" r="6.5" fill="#4c9af5" />

  <!-- 6. Background Activity Blocks Preview (Subtle Palette Matrix) -->
  <g opacity="0.18">
    <rect x="116" y="196" width="76" height="18" rx="9" fill="#ff5d63" />
    <rect x="204" y="196" width="104" height="18" rx="9" fill="#6558f5" />
    <rect x="320" y="196" width="76" height="18" rx="9" fill="#46a978" />
  </g>

  <!-- 7. Dynamic Rhythm Pulse Wave Overlay -->
  <!-- Ambient Glow Behind Wave -->
  <path
    d="M 106 294 L 178 294 L 204 256 L 228 344 L 264 200 L 298 356 L 324 294 L 406 294"
    fill="none"
    stroke="#6558f5"
    stroke-width="22"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.25"
  />

  <!-- Crisp Core Glowing Line -->
  <path
    d="M 106 294 L 178 294 L 204 256 L 228 344 L 264 200 L 298 356 L 324 294 L 406 294"
    fill="none"
    stroke="url(#pulseLineGrad)"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#pulseGlow)"
  />

  <!-- 8. Luminous Apex Marker on Peak -->
  <circle cx="264" cy="200" r="10" fill="#ffffff" filter="drop-shadow(0px 0px 8px #5be2a3)" />
  <circle cx="264" cy="200" r="5" fill="#46a978" />
</svg>
